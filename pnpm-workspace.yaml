# Two roots, on purpose.
#
# `apps/*` are things that get deployed. `packages/*` are things that get
# installed — each one is a published artefact with its own README and its own
# showcase route on the site. Adding a package means adding a directory here
# and nothing else.
packages:
  - apps/*
  - packages/*
# esbuild ships a platform-specific binary and needs its postinstall to run.
allowBuilds:
  esbuild: true

# drizzle-kit still pulls the deprecated @esbuild-kit/* packages, which pin
# esbuild 0.18.20 — a version whose dev server accepts requests from any
# website. Nothing here runs that dev server, so the practical risk is low, but
# the alert is real and the fix is one line.
overrides:
  esbuild@<0.25.0: ">=0.25.0"
