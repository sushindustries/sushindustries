# The stack, as data.
#
# One entry per thing this repo depends on. `pnpm sushindustries stack` reads
# it and `pnpm sushindustries refs` fetches every `llms` URL once and cuts it
# into a local shard, so looking up someone else's API is a file read rather
# than a guess.
#
# llms: the provider's own machine-readable documentation index. Only listed
# when it actually resolves. A 404 in here is worse than a blank, because a
# blank says "nobody publishes one" and a 404 says nothing at all.
#
# Shape is deliberately flat: a list of items, one `key: value` per line. The
# reader in lib/context.mjs is twenty lines because of it, and the table this
# generates can stay a table.

- name: React
  package: react
  version: 19.2.8
  purpose: interface
  for: The component model every visible thing in packages/ui is written in.
  docs: https://react.dev
  llms: https://react.dev/llms.txt

- name: TanStack Start
  package: "@tanstack/react-start"
  version: 1.168.46
  purpose: interface
  for: The framework. Vite in front, Nitro behind, server routes for the machine-readable endpoints.
  docs: https://tanstack.com/start
  llms: https://tanstack.com/llms.txt

- name: TanStack Router
  package: "@tanstack/react-router"
  version: 1.170.29
  purpose: interface
  for: File-based routing. Dynamic segments stay flat files and escaped dots carry the .md and .xml endpoints.
  docs: https://tanstack.com/router
  llms: https://tanstack.com/llms.txt

- name: TanStack Query
