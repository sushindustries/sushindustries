name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: nothing is learned from finishing a run
# for a commit that is already behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Workspaces vs Dockerfile
        run: node scripts/check-workspaces.mjs

      - name: Format and lint
        run: pnpm exec biome check .

      - name: Types
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The check that matters. Three deploys failed on things only a real
      # image build catches: a workspace whose dist was never built, a COPY of
      # a node_modules that does not exist, and a cache mount the host rejects.
      # `pnpm build` on a developer machine passes through all of them.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sushindustries:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds and then exits on boot is still a failed deploy.
      - name: Boot it and hit the healthcheck
        run: |
          docker run -d --name web -p 3000:3000 -e PORT=3000 sushindustries:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -fsS http://localhost:3000/ > /dev/null && echo "home ok"
              docker rm -f web
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy:"
          docker logs web
          docker rm -f web
          exit 1
