# Skill tree for the sushindustries monorepo.
#
# One core skill per public package that ships an API worth teaching. The
# taxonomy is deliberately flat: each package is small enough that a single
# well-scoped core skill beats a tree of fragments.
library:
  name: sushindustries
  version: '0.1.0'

skills:
  - name: core
    slug: '@sushindustries/atoms#core'
    path: packages/atoms/skills/core/SKILL.md
    package: packages/atoms
    packages: ['@sushindustries/atoms']
    covers:
      - utility vocabulary and the one-class-per-job rule
      - the --s-* token scale with no arbitrary-value escape hatch
      - container queries and fluid-unit rules
  - name: core
    slug: '@sushindustries/ui#core'
    path: packages/ui/skills/core/SKILL.md
    package: packages/ui
    packages: ['@sushindustries/ui']
    covers:
      - the two install paths (pnpm add, TanStack CLI registry)
      - styles come from atoms, variants are data attributes
  - name: core
    slug: '@sushindustries/db#core'
    path: packages/db/skills/core/SKILL.md
    package: packages/db
    packages: ['@sushindustries/db']
    covers:
      - schema vs client.server entry-point split
      - lazy connection construction, never at module scope
  - name: core
    slug: '@sushindustries/access#core'
    path: packages/access/skills/core/SKILL.md
    package: packages/access
    packages: ['@sushindustries/access']
    covers:
      - the client-safe entry point and the two server-only ones
      - preview on GET, redeem on POST, and why a scanner spends the link
      - the plaintext exists once, in the return value that created it
  - name: core
    slug: '@sushindustries/assistant#core'
    path: packages/assistant/skills/core/SKILL.md
    package: packages/assistant
    packages: ['@sushindustries/assistant']
    covers:
      - props-in panel with no owned transport
      - persona.md structure and the JSX comment-escaping trap
  - name: core
    slug: '@sushindustries/react-product-viewer#core'
    path: packages/react-product-viewer/skills/core/SKILL.md
    package: packages/react-product-viewer
    packages: ['@sushindustries/react-product-viewer']
    covers:
      - lazy loading without breaking SSR
      - Query/Router split and the icon-size ModelMark trap

coverage:
  # Written by `pnpm sushindustries intent --sync`. Every public package
  # with no skill appears here; the reason beside it is written by hand and
  # carried across every regeneration, because why something is out of
  # scope is not something a directory listing knows.
  ignored_packages:
    - name: '@sushindustries/access'
      reason: tokens and invitations over Postgres; the README carries the two properties worth knowing and the API is six functions
    - name: '@sushindustries/cli'
      reason: a program rather than a library - it is used by running it, and `adam-jurek --help` is its own documentation
    - name: '@sushindustries/github'
      reason: an Apollo Connectors schema with no resolvers and no code; there is no API to teach
    - name: '@sushindustries/http'
      reason: five decisions a server makes about a response; small enough that the README is the whole teaching surface
    - name: '@sushindustries/llms'
      reason: llms.txt/robots/sitemap text generators; no agent-facing API surface worth a skill yet
    - name: '@sushindustries/product-viewer'
      reason: the framework-free half of the viewer; everything an agent would ask about it is answered by the React package's skill
