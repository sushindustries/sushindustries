# Coolify: Docker Compose build pack, compose location deploy/coolify/compose.yaml
services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        POSTHOG_HOST: ${POSTHOG_HOST:-}
    image: ghcr.io/sushindustries/sushindustries:${IMAGE_TAG:-main}
    restart: unless-stopped
    expose: ["3000"]
    environment:
      SERVICE_URL_WEB_3000: ""
      PORT: ${PORT:-3000}
      NODE_ENV: production
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-sushindustries}
      POSTHOG_HOST: ${POSTHOG_HOST:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        POSTHOG_HOST: ${POSTHOG_HOST:-}
    image: ghcr.io/sushindustries/sushindustries:${IMAGE_TAG:-main}
    command: ["node", "migrate.mjs"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-sushindustries}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Version is UNKNOWN in the repo; 17.6 is a placeholder choice, see Known gaps.
    image: postgres:17.6-alpine # TODO pin digest
    restart: unless-stopped
    expose: ["5432"]
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-sushindustries}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
